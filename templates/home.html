* {

body {

h1 {

p {

label.section-title {
  display: block;

  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
  color: #333;
}

input[type="text"],
input[type="email"],
select {

  width: 100%;
  height: 44px;
  border: 0;
  border-radius: 3px;
  margin: 0 0 15px 0;
  padding: 0 12px;
  background: #fff;
  font-family: 'PT Sans Narrow', sans-serif;
  font-size: 18px;
  color: #333;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

select {
  background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M0 3l5 5 5-5z' fill='%23555'/></svg>") no-repeat right 12px center;
}

input:focus, select:focus {
  background: #eee;
}

/* Tag Selection Styling */
.tag-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 15px;
}

.tag-btn {
  background: #fff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 15px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.tag-btn input {
  display: none;
}

.tag-btn:has(input:checked) {
  background: linear-gradient(45deg, #FF6C54, #FFA754);
  color: #fff;
  font-weight: 700;
}

/* Dynamic Location Selector & Badges */
#location-wrapper {
  display: block; /* Visible by default now */
  background: #f0f0f0;
  padding: 12px;
  border-radius: 3px;
  margin-bottom: 15px;
}

.location-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.location-row select {
  margin-bottom: 0;
  flex: 1;
}

.btn-add-location {
  height: 44px;
  padding: 0 15px;
  background: #333;
  color: #fff;
  border: 0;
  border-radius: 3px;
  font-family: 'PT Sans Narrow', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
}

.btn-add-location:hover {
  background: #555;
}

.location-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.location-badge {
  background: #fff;
  padding: 4px 10px;
  border-radius: 3px;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.location-badge .remove-loc {
  cursor: pointer;
  color: #FF6C54;
  font-weight: 700;
}

/* File Upload Minimalist Styling */
.file-container {
  margin-bottom: 20px;
}

input[type="file"] {
  font-family: 'PT Sans Narrow', sans-serif;
  font-size: 14px;
  margin-top: 5px;
}

.disclaimer {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
  display: block;
}

/* Submit Button */
input[type="submit"] {
  display: block;
  width: 100%;
  height: 50px;
  margin: 25px 0 0 0;
  padding: 0;
  border: 0;
  border-radius: 3px;
  cursor: pointer;
  font-family: 'PT Sans Narrow', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 1px;
  color: #fff;
  background: linear-gradient(45deg, #FF6C54, #FFA754);
  text-transform: uppercase;
}

input[type="submit"]:hover {
  background: linear-gradient(180deg, #FF6C54, #FFA754);
}
</style>
</head>

<script>
const onsiteTrigger = document.getElementById('onsite-trigger');
const locationWrapper = document.getElementById('location-wrapper');
const countrySelect = document.getElementById('country-select');
const citySelect = document.getElementById('city-select');
const btnAdd = document.getElementById('btn-add');
const badgesContainer = document.getElementById('location-badges-container');

// Tracks active chosen locations to avoid duplicates
let selectedLocationsSet = new Set();

// Toggle menu container visibility based on Checkbox status
onsiteTrigger.addEventListener('change', function() {
  locationWrapper.style.display = this.checked ? 'block' : 'none';
});

const cityCache = {};

async function load_cities(country_code){
  citySelect.innerHTML = '<option>Loading…</option>';

  if (!cityCache[country_code]) {
    try {
      const resp = await fetch(`/static/cities/${country_code}.json`);
      cityCache[country_code] = await resp.json();
    } catch (e) {
      console.log(e);
      citySelect.innerHTML = '<option>Failed to load</option>';
      return;
    }
  }

  const fragment = document.createDocumentFragment();

  cityCache[country_code].forEach(city => {
    const opt = document.createElement('option');
    opt.value = city.code;
    opt.textContent = city.name;
    fragment.appendChild(opt);
  });
  citySelect.innerHTML = '';
  citySelect.appendChild(fragment);

}

countrySelect.addEventListener('change', async function() {
  await load_cities(this.value);
});

// Logic to construct visual location badge items
function addLocationBadge(countryCode, countryName, cityCode, cityName) {
  if (selectedLocationsSet.has(cityCode)) return; // Avoid duplicates
  selectedLocationsSet.add(cityCode);

  const badge = document.createElement('div');
  badge.className = 'location-badge';
  badge.dataset.key = cityCode;
  badge.innerHTML = `${cityName}, ${countryName} <span class="remove-loc">&times;</span>`;
  
  const hiddenInput = document.createElement('input');
  hiddenInput.type = 'hidden';
  hiddenInput.name = 'selected_locations[]';
  hiddenInput.value = cityCode
  badge.appendChild(hiddenInput);

  badge.querySelector('.remove-loc').addEventListener('click', function() {
    selectedLocationsSet.delete(cityCode);
    badge.remove();
  });

  badgesContainer.appendChild(badge);
}

btnAdd.addEventListener('click', function() {
  const countryName = countrySelect.options[countrySelect.selectedIndex].text;
  const countryCode = countrySelect.value;
  const cityName = citySelect.options[citySelect.selectedIndex].text;
  const cityCode = citySelect.value;

  addLocationBadge(countryCode, countryName, cityCode, cityName);
});

load_cities('NP');
addLocationBadge('NP', 'Nepal', '82505', 'Kathmandu');
</script>
